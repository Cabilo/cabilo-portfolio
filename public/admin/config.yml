backend:
  name: turbo-github
  turbo_site_id: 1474ffb3-9850-4801-a13d-418ab9c4a71c
  branch: architecture-functions

media_folder: "public/uploads"
public_folder: "/uploads"

collections:

  # ============================================================
  # POOLS
  # ============================================================

  - name: "pools"
    label: "Pools"
    files:
      - label: "Tag Pool"
        name: "tags"
        file: "src/content/pools/tags.json"
        fields:
          - label: "Tags"
            name: "values"
            widget: "list"
            hint: "Canonical Tag Pool values. These power Tags, Role, Client, and Category across Projects and Learning."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
      - label: "Software Pool"
        name: "software"
        file: "src/content/pools/software.json"
        fields:
          - label: "Software"
            name: "values"
            widget: "list"
            hint: "Canonical Software Pool values. These power Software Used across Projects and Learning."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"

  # ============================================================
  # PROJECTS
  # ============================================================

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "relation"
        collection: "pools"
        file: "tags"
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"
        hint: "Uses the canonical Tag Pool. Example: Character."

      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        required: false

      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"

      - label: "Thumbnail Crop"
        name: "thumbnailCrop"
        widget: "object"
        required: false
        fields:
          - label: "Zoom"
            name: "zoom"
            widget: "number"
            min: 1
            max: 3
            step: 0.05
            default: 1
          - label: "Position X"
            name: "positionX"
            widget: "number"
            min: 0
            max: 100
            step: 1
            default: 50
          - label: "Position Y"
            name: "positionY"
            widget: "number"
            min: 0
            max: 100
            step: 1
            default: 50


      - label: "Showreel URL"
        name: "showreelUrl"
        widget: "string"
        required: false

      - label: "Role"
        name: "role"
        widget: "relation"
        collection: "pools"
        file: "tags"
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"
        default: "Lead 3D Artist"
        hint: "Uses the canonical Tag Pool. Example: Lead 3D Artist."

      - label: "Client"
        name: "client"
        widget: "relation"
        collection: "pools"
        file: "tags"
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"
        default: "Personal Project"
        hint: "Uses the canonical Tag Pool. Example: Nike."

      - label: "Tags"
        name: "tags"
        widget: "relation"
        collection: "pools"
        file: "tags"
        multiple: true
        min: 1
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"

      - label: "Software Used"
        name: "softwareUsed"
        widget: "relation"
        collection: "pools"
        file: "software"
        multiple: true
        min: 1
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"

      - label: "Media Blocks"
        name: "mediaBlocks"
        widget: "list"
        required: false
        types:

          - label: "Text Block"
            name: "text_block"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Content"
                name: "content"
                widget: "markdown"
                default: ""

          - label: "Image"
            name: "image"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

              - label: "Image"
                name: "image"
                widget: "image"

              - label: "Fit to viewport"
                name: "fitToViewport"
                widget: "boolean"
                required: false
                default: true

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

          - label: "Video"
            name: "video"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

              - label: "Video URL"
                name: "videoUrl"
                widget: "string"

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

          - label: "Turntable"
            name: "turntable"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

              - label: "Folder"
                name: "folder"
                widget: "string"

              - label: "Fit to viewport"
                name: "fitToViewport"
                widget: "boolean"
                required: false
                default: true

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

          - label: "AOV"
            name: "aov"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
