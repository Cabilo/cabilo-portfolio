backend:
  name: github
  repo: Cabilo/cabilo-portfolio
  branch: main
  use_pkce: true
  app_id: Ov23liaGvVjZ0EECKYA8

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
      - { label: "Showreel URL", name: "showreelUrl", widget: "string", required: false }
      - { label: "Your Role", name: "role", widget: "string", default: "Lead 3D Artist" }
      - { label: "Client", name: "client", widget: "string", default: "Personal Project" }
      - label: "Software Used"
        name: "softwareUsed"
        widget: "select"
        multiple: true
        create: true
        options: ["Unreal Engine 5", "Maya", "Nuke", "ZBrush", "Substance Painter", "Houdini"]
      - { label: "AOV Section Title Override", name: "aovTitle", widget: "string", required: false }
      - label: "AOV Passes"
        name: "aovPasses"
        widget: "list"
        required: false
        fields:
          - { label: "Pass Name", name: "name", widget: "string" }
          - { label: "Image", name: "image", widget: "image" }
      - { label: "Turntable Title Override", name: "turntableTitle", widget: "string", required: false }
      - { label: "Turntable Folder", name: "turntable", widget: "string", required: false }
      - { label: "Project Breakdown", name: "body", widget: "markdown" }

  - name: "learning"
    label: "Learning (Tutorials & Breakdowns)"
    folder: "src/content/learning"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Post Type", name: "type", widget: "select", options: ["Tutorial", "Breakdown"] }
      - { label: "Format", name: "format", widget: "select", options: ["Video", "Article"] }
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        create: true
        options: ["Lighting", "Topology", "Lookdev", "Cinematics", "Texturing", "Compositing"]
      - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
      - { label: "YouTube ID", name: "youtubeId", widget: "string", required: false }
      - { label: "Feature this post?", name: "featured", widget: "boolean", default: false }
      - { label: "Article Content", name: "body", widget: "markdown" }