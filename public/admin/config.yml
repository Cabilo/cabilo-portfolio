backend:
  name: turbo-github
  turbo_site_id: 1474ffb3-9850-4801-a13d-418ab9c4a71c
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:

  # ============================================================
  # GLOBAL PAGES & SEO
  # ============================================================
  
  - name: "pages"
    label: "Global Pages & SEO"
    files:

      # 1. HOMEPAGE & GLOBAL SEO
      - label: "Home Page & Global SEO"
        name: "home"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Page Name", name: "title", widget: "hidden", default: "Home" }
          - { label: "Main Headline", name: "headline", widget: "string", hint: "The last word of this sentence will automatically glow Amber!" }
          - { label: "Subheadline / Bio", name: "subheadline", widget: "text" }
          - { label: "Showreel URL", name: "showreelUrl", widget: "string", hint: "Paste a YouTube, Vimeo, or direct .mp4 link to update the homepage video." }
          
          # SEO MOVED HERE!
          - { label: "Global Browser Title", name: "globalSeoTitle", widget: "string", default: "CABILO | Senior 3D Artist & Cinematics" }
          - { label: "Global Description", name: "globalSeoDescription", widget: "text" }
          - { label: "Global Social Thumbnail", name: "globalSeoImage", widget: "image", hint: "This image appears when you paste your homepage link in Discord/LinkedIn." }

      # 2. ABOUT PAGE
      - label: "About Page"
        name: "about"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Page Name", name: "title", widget: "hidden", default: "About" }
          - { label: "Main Headline", name: "headline", widget: "string", default: "About CABILO" }
          - { label: "Job Title", name: "subheadline", widget: "string", default: "Senior 3D Artist" }
          - { label: "Software Arsenal Tags", name: "softwareArsenal", widget: "list", default: ["Unreal Engine 5", "Maya", "Nuke", "ZBrush"] }
          - { label: "Biography (Markdown)", name: "body", widget: "markdown" }

      # 3. CONTACT PAGE
      - label: "Contact Page"
        name: "contact"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "Page Name", name: "title", widget: "hidden", default: "Contact" }
          - { label: "Main Headline", name: "headline", widget: "string", default: "Let's Connect" }
          - { label: "Subheadline", name: "subheadline", widget: "string" }
          - { label: "Body Content (Not used on Contact)", name: "body", widget: "hidden", default: "" }

  # ============================================================
  # PROJECTS
  # ============================================================

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"

    fields:

      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
      - { label: "Showreel URL", name: "showreelUrl", widget: "string", required: false, hint: "Optional. Paste a YouTube, Vimeo, or direct .mp4 link to replace the top thumbnail with a video." }
      - { label: "Your Role", name: "role", widget: "string", default: "Lead 3D Artist" }
      - { label: "Client", name: "client", widget: "string", default: "Personal Project" }
      - { label: "Software Used", name: "softwareUsed", widget: "list", default: ["Unreal Engine 5", "Maya", "Nuke"] }

      - label: "Media Blocks"
        name: "mediaBlocks"
        widget: "list"
        required: false
        label_singular: "Media Block"
        collapsed: true

        types:

          - label: "Text Block"
            name: "text_block"
            widget: "object"
            hint: "Use this for explanatory text or paragraphs between media blocks."
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Content (Markdown)", name: "content", widget: "markdown" }

          - label: "Image"
            name: "image"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Comment", name: "comment", widget: "text", required: false }

          - label: "Video"
            name: "video"
            widget: "object"
            hint: "Paste a YouTube, Vimeo, or direct .mp4 URL."
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Video URL", name: "videoUrl", widget: "string" }
              - { label: "Comment", name: "comment", widget: "text", required: false }

          - label: "Turntable"
            name: "turntable"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Folder: turntables/...", name: "folder", widget: "string", hint: "Use the folder path relative to public/. Example: turntables/test. Do NOT start with / and do NOT include public/." }
              - { label: "Comment", name: "comment", widget: "text", required: false }

          - label: "AOV"
            name: "aov"
            widget: "object"
            hint: "Upload a minimum of two passes (e.g. Viewport and Wireframe) to create an interactive slider."
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - label: "AOV Passes"
                name: "aovPasses"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Image", name: "image", widget: "image" }
              - { label: "Comment", name: "comment", widget: "text", required: false }

      - { label: "Project Breakdown", name: "body", widget: "markdown" }

  # ============================================================
  # LEARNING
  # ============================================================

  - name: "learning"
    label: "Learning (Tutorials & Breakdowns)"
    folder: "src/content/learning"
    create: true
    slug: "{{slug}}"

    fields:

      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Post Type", name: "type", widget: "select", options: ["Tutorial", "Breakdown"] }
      - { label: "Format", name: "format", widget: "select", options: ["Video", "Article"] }
      - { label: "Tags", name: "tags", widget: "list", default: ["Lighting", "Topology"] }
      - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
      
      # FIXED: Changed from youtubeId to universal videoUrl!
      - { label: "Video URL", name: "videoUrl", widget: "string", required: false, hint: "Paste a YouTube, Vimeo, or direct .mp4 link." }
      
      - { label: "Feature this post?", name: "featured", widget: "boolean", default: false }
      - { label: "Article Content", name: "body", widget: "markdown" }