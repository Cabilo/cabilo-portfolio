theme:
  mode: dark

backend:
  name: turbo-github
  turbo_site_id: 1474ffb3-9850-4801-a13d-418ab9c4a71c
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:

  # ============================================================
  # POOLS
  # ============================================================

  - name: "pools"
    label: "Pools"
    files:
      - label: "Tag Pool"
        name: "tags"
        file: "src/content/pools/tags.json"
        fields:
          - label: "Tags"
            name: "values"
            widget: "list"
            hint: "Canonical Tag Pool values. These power Tags, Role, Client, and Category across Projects and Learning."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
      - label: "Software Pool"
        name: "software"
        file: "src/content/pools/software.json"
        fields:
          - label: "Software"
            name: "values"
            widget: "list"
            hint: "Canonical Software Pool values. These power Software Used across Projects and Learning."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"

              - label: "Add to Arsenal"
                name: "addToArsenal"
                widget: "boolean"
                default: true

  # ============================================================
  # PROJECTS
  # ============================================================

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "relation"
        collection: "pools"
        file: "tags"
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"
        hint: "Uses the canonical Tag Pool. Example: Character."

      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        required: false

      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"

      - label: "Compress Thumbnail (WebP)"
        name: "compressThumbnail"
        widget: "boolean"
        required: false
        default: true

      - label: "Thumbnail Crop"
        name: "thumbnailCrop"
        widget: "thumbnailCrop"
        image_field: "thumbnail"
        required: false
        hint: "Open the crop editor to position and zoom the thumbnail. The square editor controls the same crop values used by the site."


      - label: "Showreel URL"
        name: "showreelUrl"
        widget: "string"
        required: false
      - label: "Fit showreel to viewport"
        name: "showreelFitToViewport"
        widget: "boolean"
        required: false
        default: true

      - label: "Role"
        name: "role"
        widget: "relation"
        collection: "pools"
        file: "tags"
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"
        default: "Lead 3D Artist"
        hint: "Uses the canonical Tag Pool. Example: Lead 3D Artist."

      - label: "Client"
        name: "client"
        widget: "relation"
        collection: "pools"
        file: "tags"
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"
        default: "Personal Project"
        hint: "Uses the canonical Tag Pool. Example: Nike."

      - label: "Tags"
        name: "tags"
        widget: "relation"
        collection: "pools"
        file: "tags"
        multiple: true
        min: 1
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"

      - label: "Software Used"
        name: "softwareUsed"
        widget: "relation"
        collection: "pools"
        file: "software"
        multiple: true
        min: 1
        search_fields:
          - "values.*.name"
        value_field: "values.*.name"
        display_fields:
          - "values.*.name"

      # Experimental Layout Blocks system.
      # This is intentionally separate from Media Blocks while the new
      # matrix-based layout editor is being tested.
      - label: "Layout Blocks (Experimental)"
        name: "layoutBlocks"
        widget: "layoutBlocks"
        required: false
        default: []
        hint: "Experimental ∞ × 5 layout matrix. Drag and resize blocks; Constrained snaps to full grid units, Free snaps to half-grid units."

      - label: "Media Blocks"
        name: "mediaBlocks"
        widget: "list"
        required: false
        types:

          - label: "Media Group"
            name: "group"
            widget: "object"
            fields:

              - label: "Columns"
                name: "columns"
                widget: "number"
                value_type: "int"
                min: 1
                max: 5
                default: 2
                hint: "Choose 1–5 columns. A group can contain up to 5 mixed media blocks."

              - label: "Items"
                name: "items"
                widget: "list"
                min: 1
                max: 5
                collapsed: true
                label_singular: "Media Item"
                types:

                  - label: "Text Block"
                    name: "text_block"
                    widget: "object"
                    fields:

                      - label: "Title"
                        name: "title"
                        widget: "string"
                        required: false

                      - label: "Content"
                        name: "content"
                        widget: "markdown"
                        default: ""

                  - label: "Image"
                    name: "image"
                    widget: "object"
                    fields:

                      - label: "Title"
                        name: "title"
                        widget: "string"
                        required: false

                      - label: "Title Alignment"
                        name: "titleAlign"
                        widget: "select"
                        required: false
                        default: "page-left"
                        options:
                          - { label: "Media Left", value: "media-left" }
                          - { label: "Center", value: "center" }
                          - { label: "Page Left", value: "page-left" }
                          - { label: "Page Right", value: "page-right" }

                      - label: "Image"
                        name: "image"
                        widget: "image"

                      - label: "Compress Image (WebP)"
                        name: "compress"
                        widget: "boolean"
                        required: false
                        default: true

                      - label: "Fit to viewport"
                        name: "fitToViewport"
                        widget: "boolean"
                        required: false
                        default: true

                      - label: "Comment"
                        name: "comment"
                        widget: "text"
                        required: false

                      - label: "Comment Alignment"
                        name: "commentAlign"
                        widget: "select"
                        required: false
