                fields:

                  - label: "Name"
                    name: "name"
                    widget: "string"

                  - label: "Image"
                    name: "image"
                    widget: "image"

              - label: "Fit to viewport"
                name: "fitToViewport"
                widget: "boolean"
                required: false
                default: true

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }


