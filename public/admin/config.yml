backend:
  name: turbo-github
  turbo_site_id: 1474ffb3-9850-4801-a13d-418ab9c4a71c
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:

  # ============================================================
  # PROJECTS
  # ============================================================

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "string"

      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"

      - label: "Showreel URL"
        name: "showreelUrl"
        widget: "string"
        required: false

      - label: "Role"
        name: "role"
        widget: "string"
        default: "Lead 3D Artist"

      - label: "Client"
        name: "client"
        widget: "string"
        default: "Personal Project"

      - label: "Software Used"
        name: "softwareUsed"
        widget: "list"
        default: []

      - label: "Media Blocks"
        name: "mediaBlocks"
        widget: "list"
        required: false
        types:

          - label: "Text Block"
            name: "text_block"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Content"
                name: "content"
                widget: "markdown"
                default: ""

          - label: "Image"
            name: "image"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

              - label: "Image"
                name: "image"
                widget: "image"

              - label: "Fit to viewport"
                name: "fitToViewport"
                widget: "boolean"
                required: false
                default: true

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

          - label: "Video"
            name: "video"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

              - label: "Video URL"
                name: "videoUrl"
                widget: "string"

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

          - label: "Turntable"
            name: "turntable"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

              - label: "Folder"
                name: "folder"
                widget: "string"

              - label: "Fit to viewport"
                name: "fitToViewport"
                widget: "boolean"
                required: false
                default: true

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

          - label: "AOV"
            name: "aov"
            widget: "object"
            fields:

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Title Alignment"
                name: "titleAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }

              - label: "AOV Passes"
                name: "aovPasses"
                widget: "list"
                default: []
                fields:

                  - label: "Name"
                    name: "name"
                    widget: "string"

                  - label: "Image"
                    name: "image"
                    widget: "image"

              - label: "Fit to viewport"
                name: "fitToViewport"
                widget: "boolean"
                required: false
                default: true

              - label: "Comment"
                name: "comment"
                widget: "text"
                required: false

              - label: "Comment Alignment"
                name: "commentAlign"
                widget: "select"
                required: false
                default: "page-left"
                options:
                  - { label: "Media Left", value: "media-left" }
                  - { label: "Center", value: "center" }
                  - { label: "Page Left", value: "page-left" }
                  - { label: "Page Right", value: "page-right" }


